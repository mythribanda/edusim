<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  width="100%"
  height="100%"
  preserveAspectRatio="xMidYMid meet"
  aria-label="Realistic Moon"
>

  <defs>

    <!-- Main Moon Surface -->
    <radialGradient id="moonBase" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#dbe3ec"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="90%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <!-- Crater Light -->
    <radialGradient id="craterLight" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#64748b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="1"/>
    </radialGradient>

    <!-- Crater Dark -->
    <radialGradient id="craterDark" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Rim Lighting -->
    <radialGradient id="rimLight" cx="25%" cy="20%" r="85%">
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="92%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Surface Shadow -->
    <radialGradient id="surfaceShadow" cx="70%" cy="70%" r="75%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

  </defs>

  <!-- Main Moon Body -->
  <circle
    cx="100"
    cy="100"
    r="92"
    fill="url(#moonBase)"
  />

  <!-- Large Surface Regions -->
  <g fill="#475569" opacity="0.22">

    <path
      d="M 38,34
         C 55,28 82,38 78,62
         C 73,84 42,88 28,72
         C 18,58 22,38 38,34 Z"
    />

    <path
      d="M 112,42
         C 132,38 162,48 158,66
         C 154,82 130,90 116,82
         C 102,74 102,48 112,42 Z"
    />

    <path
      d="M 142,98
         C 156,98 174,108 170,122
         C 166,136 144,142 138,128
         C 132,114 132,98 142,98 Z"
    />

    <path
      d="M 62,118
         C 82,114 104,128 100,146
         C 96,164 72,170 58,156
         C 48,142 52,122 62,118 Z"
    />

  </g>

  <!-- Tycho Crater Rays -->
  <g
    stroke="#f8fafc"
    stroke-width="1"
    fill="none"
    opacity="0.22"
    stroke-linecap="round"
  >

    <line x1="90" y1="152" x2="45" y2="122"/>
    <line x1="90" y1="152" x2="50" y2="88"/>
    <line x1="90" y1="152" x2="96" y2="58"/>
    <line x1="90" y1="152" x2="138" y2="100"/>
    <line x1="90" y1="152" x2="148" y2="142"/>
    <line x1="90" y1="152" x2="120" y2="180"/>

  </g>

  <!-- Main Tycho Crater -->
  <g>

    <circle
      cx="90"
      cy="152"
      r="10"
      fill="url(#craterDark)"
    />

    <path
      d="M 80,152 A 10,10 0 0 1 100,152"
      fill="none"
      stroke="#ffffff"
      stroke-width="1"
      opacity="0.55"
    />

    <circle
      cx="89"
      cy="151"
      r="2"
      fill="#e2e8f0"
      opacity="0.8"
    />

  </g>

  <!-- Large Crater -->
  <g>

    <circle
      cx="62"
      cy="86"
      r="12"
      fill="url(#craterLight)"
    />

    <path
      d="M 50,86 A 12,12 0 0 1 74,86"
      fill="none"
      stroke="#ffffff"
      stroke-width="1"
      opacity="0.5"
    />

    <circle
      cx="61"
      cy="85"
      r="2"
      fill="#f8fafc"
      opacity="0.75"
    />

  </g>

  <!-- Small Craters -->
  <g>

    <circle cx="42" cy="96" r="5" fill="url(#craterLight)"/>
    <circle cx="96" cy="34" r="8" fill="url(#craterDark)"/>
    <circle cx="160" cy="106" r="9" fill="url(#craterDark)"/>
    <circle cx="148" cy="138" r="11" fill="url(#craterDark)"/>
    <circle cx="120" cy="56" r="4" fill="url(#craterLight)"/>
    <circle cx="144" cy="46" r="6" fill="url(#craterLight)"/>
    <circle cx="70" cy="46" r="3" fill="url(#craterLight)"/>
    <circle cx="116" cy="106" r="5" fill="url(#craterLight)"/>
    <circle cx="132" cy="82" r="3" fill="url(#craterLight)"/>
    <circle cx="36" cy="136" r="7" fill="url(#craterDark)"/>

  </g>

  <!-- Crater Highlights -->
  <g
    stroke="#ffffff"
    stroke-width="0.7"
    fill="none"
    opacity="0.4"
  >

    <path d="M 37,96 A 5,5 0 0 1 47,96"/>
    <path d="M 88,34 A 8,8 0 0 1 104,34"/>
    <path d="M 151,106 A 9,9 0 0 1 169,106"/>
    <path d="M 137,138 A 11,11 0 0 1 159,138"/>
    <path d="M 116,56 A 4,4 0 0 1 124,56"/>
    <path d="M 138,46 A 6,6 0 0 1 150,46"/>

  </g>

  <!-- Surface Speckles -->
  <g fill="#ffffff" opacity="0.12">

    <circle cx="58" cy="58" r="1"/>
    <circle cx="74" cy="72" r="1"/>
    <circle cx="128" cy="64" r="1"/>
    <circle cx="146" cy="92" r="1"/>
    <circle cx="80" cy="128" r="1"/>
    <circle cx="118" cy="138" r="1"/>
    <circle cx="154" cy="122" r="1"/>

  </g>

  <!-- Surface Shadow -->
  <circle
    cx="100"
    cy="100"
    r="92"
    fill="url(#surfaceShadow)"
  />

  <!-- Rim Glow -->
  <circle
    cx="100"
    cy="100"
    r="92"
    fill="url(#rimLight)"
    pointer-events="none"
  />

</svg>
