<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="170 170 560 560" fill="none">

  <defs>
    <linearGradient id="hull-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="hull-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="accent-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="window-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="fire-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rocket -->
  <g id="rocket" transform="translate(0, -30)">

    <!-- Fire -->
    <g id="fire-blast">
      <path d="M 370,520 Q 400,750 400,780 Q 400,750 430,520 Z"
            fill="url(#fire-core)"
            opacity="0.4"
            filter="url(#glow)" />

      <path d="M 382,520 Q 400,680 400,720 Q 400,680 418,520 Z"
            fill="url(#fire-core)" />

      <circle cx="395" cy="570" r="6" fill="#fef08a" />
      <circle cx="410" cy="610" r="4" fill="#f97316" />
      <circle cx="385" cy="650" r="5" fill="#ef4444" />
      <circle cx="400" cy="690" r="3" fill="#fef08a" />
    </g>

    <!-- Side Fins -->
    <path d="M 360,420 L 290,490 L 290,520 L 360,490 Z"
          fill="url(#hull-dark)" />

    <path d="M 440,420 L 510,490 L 510,520 L 440,490 Z"
          fill="url(#hull-dark)" />

    <!-- Center Fin -->
    <path d="M 400,420 L 388,505 L 400,525 L 412,505 Z"
          fill="url(#accent-red)" />

    <!-- Engine -->
    <rect x="375" y="495"
          width="50"
          height="28"
          rx="4"
          fill="#1e293b"
          stroke="#0f172a"
          stroke-width="2" />

    <ellipse cx="400"
             cy="520"
             rx="20"
             ry="5"
             fill="#ef4444"
             filter="url(#glow)" />

    <!-- Body -->
    <path d="M 360,220 C 360,220 360,440 360,495 L 440,495 C 440,440 440,220 440,220 Z"
          fill="url(#hull-light)" />

    <!-- Nose -->
    <path d="M 360,221 C 360,140 390,70 400,50 C 410,70 440,140 440,221 Z"
          fill="url(#accent-red)" />

    <!-- Accent -->
    <rect x="360" y="250"
          width="80"
          height="15"
          fill="url(#accent-red)" />

    <!-- Window -->
    <circle cx="400"
            cy="310"
            r="28"
            fill="#1e293b" />

    <circle cx="400"
            cy="310"
            r="22"
            fill="url(#window-glass)" />

    <path d="M 382,300 C 395,290 415,295 420,310 C 410,300 395,300 382,300 Z"
          fill="#ffffff"
          opacity="0.5" />

  </g>

</svg>
