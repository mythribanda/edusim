<svg width="560" height="560" viewBox="170 170 560 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cinematic Sun Illustration</title>
<desc>Ultra-detailed SVG illustration of the Sun with corona, solar flares, plasma textures, and volumetric glow layers.</desc>
<defs>
  <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="8%"   stop-color="#FFFBE0" stop-opacity="1"/>
    <stop offset="20%"  stop-color="#FFF5A0" stop-opacity="1"/>
    <stop offset="38%"  stop-color="#FFCC00" stop-opacity="1"/>
    <stop offset="55%"  stop-color="#FF8800" stop-opacity="1"/>
    <stop offset="72%"  stop-color="#E84400" stop-opacity="1"/>
    <stop offset="88%"  stop-color="#C02800" stop-opacity="1"/>
    <stop offset="100%" stop-color="#7A1200" stop-opacity="1"/>
  </radialGradient>
  <radialGradient id="halo1" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#FF9900" stop-opacity="0"/>
    <stop offset="45%"  stop-color="#FF6600" stop-opacity="0"/>
    <stop offset="65%"  stop-color="#FF4400" stop-opacity="0.35"/>
    <stop offset="78%"  stop-color="#FF6600" stop-opacity="0.6"/>
    <stop offset="88%"  stop-color="#FFA020" stop-opacity="0.45"/>
    <stop offset="95%"  stop-color="#FFD040" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#FF8800" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="corona1" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#FF9900" stop-opacity="0"/>
    <stop offset="55%"  stop-color="#FF8800" stop-opacity="0"/>
    <stop offset="68%"  stop-color="#FF6600" stop-opacity="0.3"/>
    <stop offset="80%"  stop-color="#FF4400" stop-opacity="0.18"/>
    <stop offset="90%"  stop-color="#FF8800" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#FF9900" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="corona2" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#FF8800" stop-opacity="0"/>
    <stop offset="60%"  stop-color="#FF8800" stop-opacity="0"/>
    <stop offset="72%"  stop-color="#FF7700" stop-opacity="0.12"/>
    <stop offset="82%"  stop-color="#FF9900" stop-opacity="0.07"/>
    <stop offset="92%"  stop-color="#FFB800" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#FFAA00" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#FF7700" stop-opacity="0"/>
    <stop offset="65%"  stop-color="#FF7700" stop-opacity="0"/>
    <stop offset="78%"  stop-color="#FF6600" stop-opacity="0.06"/>
    <stop offset="88%"  stop-color="#FF8800" stop-opacity="0.03"/>
    <stop offset="100%" stop-color="#FFAA00" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="limbDark" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
    <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
    <stop offset="78%"  stop-color="#200800" stop-opacity="0.28"/>
    <stop offset="90%"  stop-color="#100400" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#050100" stop-opacity="0.85"/>
  </radialGradient>
  <filter id="granFilter" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.022 0.018" numOctaves="8" seed="3" result="turb"/>
    <feColorMatrix type="saturate" values="0" in="turb" result="gray"/>
    <feColorMatrix type="matrix"
      values="3  0  0  0 -0.8
              1.2 0  0  0 -0.2
              0  0  0  0  0
              0  0  0  8 -3.5"
      in="gray" result="cells"/>
    <feComposite in="cells" in2="SourceGraphic" operator="in" result="masked"/>
    <feBlend in="SourceGraphic" in2="masked" mode="overlay" result="blend"/>
    <feColorMatrix type="matrix"
      values="1.1 0.1 0   0  0.02
              0.3 0.8 0.1 0  0
              0   0   0.6 0  0
              0   0   0   1  0"
      in="blend"/>
  </filter>
  <filter id="plasmaFilter" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.028" numOctaves="6" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
    <feGaussianBlur in="displaced" stdDeviation="1.2" result="soft"/>
    <feColorMatrix type="matrix"
      values="1.15 0.15 0    0  0
              0.4  0.85 0.05 0  0
              0    0    0.5  0  0
              0    0    0    1  0"
      in="soft"/>
  </filter>
  <filter id="coronaBlur" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="18"/>
    <feColorMatrix type="matrix"
      values="1.2 0.3  0    0  0.05
              0.5 0.9  0.05 0  0
              0   0    0.4  0  0
              0   0    0    1  0"/>
  </filter>
  <filter id="outerGlow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="38"/>
    <feColorMatrix type="matrix"
      values="1.4 0.4  0    0  0.08
              0.6 1.0  0.1  0  0.02
              0   0    0.3  0  0
              0   0    0    0.8 0"/>
  </filter>
  <filter id="flareGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="10"/>
    <feColorMatrix type="matrix"
      values="1.5 0.5  0    0  0.1
              0.5 0.9  0.05 0  0
              0   0    0.2  0  0
              0   0    0    0.9 0"/>
  </filter>
  <filter id="streamBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <clipPath id="discClip">
    <circle cx="450" cy="450" r="230"/>
  </clipPath>
  <radialGradient id="granLayer" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#FFE080" stop-opacity="0.7"/>
    <stop offset="30%"  stop-color="#FFC040" stop-opacity="0.5"/>
    <stop offset="60%"  stop-color="#FF8000" stop-opacity="0.35"/>
    <stop offset="85%"  stop-color="#CC3000" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#801800" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="arcGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#FF4400" stop-opacity="0.9"/>
    <stop offset="40%"  stop-color="#FF8800" stop-opacity="0.7"/>
    <stop offset="75%"  stop-color="#FFCC00" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#FFE880" stop-opacity="0.1"/>
  </linearGradient>
  <linearGradient id="arcGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%"   stop-color="#FF3300" stop-opacity="0.85"/>
    <stop offset="50%"  stop-color="#FF7700" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#FFDD00" stop-opacity="0.05"/>
  </linearGradient>
  <linearGradient id="arcGrad3" x1="50%" y1="100%" x2="60%" y2="0%">
    <stop offset="0%"   stop-color="#CC2200" stop-opacity="0.9"/>
    <stop offset="45%"  stop-color="#FF5500" stop-opacity="0.6"/>
    <stop offset="85%"  stop-color="#FFAA00" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#FFE000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="arcGrad4" x1="0%" y1="50%" x2="100%" y2="30%">
    <stop offset="0%"   stop-color="#FF2200" stop-opacity="0.8"/>
    <stop offset="55%"  stop-color="#FF6600" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#FFCC00" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="flareGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#FF9900" stop-opacity="0"/>
    <stop offset="35%"  stop-color="#FFD060" stop-opacity="0.8"/>
    <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="80%"  stop-color="#FFCC40" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#FF6600" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="flareGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#FF8800" stop-opacity="0"/>
    <stop offset="40%"  stop-color="#FFB050" stop-opacity="0.7"/>
    <stop offset="65%"  stop-color="#FFE080" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#FF4400" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="highlight" cx="38%" cy="36%" r="35%">
    <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
    <stop offset="35%"  stop-color="#FFFACC" stop-opacity="0.2"/>
    <stop offset="70%"  stop-color="#FFE060" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#FF8800" stop-opacity="0"/>
  </radialGradient>
</defs>

<ellipse cx="450" cy="450" rx="440" ry="440" fill="url(#bloom)" filter="url(#outerGlow)" opacity="0.9"/>
<ellipse cx="450" cy="450" rx="390" ry="390" fill="url(#corona2)" filter="url(#outerGlow)" opacity="0.75"/>

<g opacity="0.18" filter="url(#streamBlur)">
  <line x1="450" y1="450" x2="450" y2="95"  stroke="#FFCC44" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="450" y2="805" stroke="#FFBB33" stroke-width="2"   stroke-linecap="round"/>
  <line x1="450" y1="450" x2="95"  y2="450" stroke="#FFA822" stroke-width="2"   stroke-linecap="round"/>
  <line x1="450" y1="450" x2="805" y2="450" stroke="#FFAA22" stroke-width="2"   stroke-linecap="round"/>
  <line x1="450" y1="450" x2="191" y2="191" stroke="#FFC033" stroke-width="1.8" stroke-linecap="round"/>
