<g opacity="0.6" filter="url(#streamBlur)">
  <path d="M450,220 Q435,195 445,178 Q455,162 460,182 Q462,200 452,222" fill="#FF5500" opacity="0.7"/>
  <path d="M606,318 Q625,305 635,290 Q644,275 635,290 Q625,305 612,322" fill="#FF4400" opacity="0.6"/>
  <path d="M294,352 Q272,345 262,330 Q255,315 266,330 Q275,345 298,356" fill="#FF3300" opacity="0.55"/>
