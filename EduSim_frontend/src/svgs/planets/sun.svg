  <circle cx="505" cy="418" r="20" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="438" cy="492" r="16" fill="#FFE080" opacity="0.2"/>
  <circle cx="468" cy="370" r="22" fill="#FFD050" opacity="0.22"/>
  <circle cx="355" cy="458" r="14" fill="#FFB040" opacity="0.16"/>
</g>
</svg>
