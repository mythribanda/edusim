  <path d="M268,558 Q210,610 180,650 Q158,680 182,658 Q205,635 248,590 Q262,572 272,560"
        fill="none" stroke="url(#arcGrad1)" stroke-width="4" stroke-linecap="round"/>
</g>

<g opacity="0.55" filter="url(#streamBlur)">
  <path d="M355,237 Q318,195 296,162 Q278,132 295,150 Q315,172 342,212 Q354,232 358,245"
        fill="none" stroke="#FFBB44" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M668,405 Q715,385 748,360 Q775,338 752,355 Q728,375 690,400 Q672,415 665,425"
