  <path d="M470,672 Q500,718 485,758 Q472,790 475,756 Q477,724 472,686 Q471,673 471,668"
        fill="none" stroke="#FF8822" stroke-width="1.2" stroke-linecap="round"/>
</g>

<circle cx="450" cy="450" r="230" fill="url(#coreGrad)"/>
<circle cx="450" cy="450" r="230" fill="url(#granLayer)" filter="url(#granFilter)" clip-path="url(#discClip)" opacity="0.92"/>
<circle cx="450" cy="450" r="230" fill="url(#granLayer)" filter="url(#plasmaFilter)" clip-path="url(#discClip)" opacity="0.45"/>
<circle cx="450" cy="450" r="230" fill="url(#limbDark)" clip-path="url(#discClip)"/>
<circle cx="450" cy="450" r="230" fill="url(#highlight)" clip-path="url(#discClip)"/>

<circle cx="450" cy="450" r="250" fill="none" stroke="#FF8800" stroke-width="28" opacity="0.22" filter="url(#coronaBlur)"/>
<circle cx="450" cy="450" r="260" fill="none" stroke="#FFAA00" stroke-width="18" opacity="0.14" filter="url(#coronaBlur)"/>

<g opacity="0.12" filter="url(#flareGlow)">
  <line x1="450" y1="140" x2="450" y2="760" stroke="url(#flareGrad1)" stroke-width="4"/>
  <line x1="140" y1="450" x2="760" y2="450" stroke="url(#flareGrad2)" stroke-width="3.5"/>
  <line x1="220" y1="220" x2="680" y2="680" stroke="url(#flareGrad1)" stroke-width="2.5"/>
  <line x1="680" y1="220" x2="220" y2="680" stroke="url(#flareGrad2)" stroke-width="2.5"/>
