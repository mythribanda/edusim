  <line x1="450" y1="450" x2="590" y2="148" stroke="#FFBB44" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="148" y2="590" stroke="#FFAA33" stroke-width="1"   stroke-linecap="round"/>
  <line x1="450" y1="450" x2="310" y2="752" stroke="#FFAA33" stroke-width="1"   stroke-linecap="round"/>
  <line x1="450" y1="450" x2="752" y2="590" stroke="#FFAA33" stroke-width="1"   stroke-linecap="round"/>
  <line x1="450" y1="450" x2="590" y2="752" stroke="#FFAA33" stroke-width="1"   stroke-linecap="round"/>
  <line x1="450" y1="450" x2="230" y2="118" stroke="#FFB840" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="118" y2="230" stroke="#FFB840" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="670" y2="118" stroke="#FFB840" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="782" y2="230" stroke="#FFB840" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="118" y2="670" stroke="#FFA033" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="230" y2="782" stroke="#FFA033" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="782" y2="670" stroke="#FFA033" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="450" y1="450" x2="670" y2="782" stroke="#FFA033" stroke-width="0.7" stroke-linecap="round"/>
</g>

<circle cx="450" cy="450" r="360" fill="url(#corona1)" filter="url(#coronaBlur)" opacity="0.85"/>
<circle cx="450" cy="450" r="310" fill="url(#halo1)"   filter="url(#coronaBlur)" opacity="0.9"/>

