<svg width="560" height="560" viewBox="170 170 560 560" xmlns="http://www.w3.org/2000/svg">
<title>Saturn</title>
<defs>
  <radialGradient id="saturnBase" cx="40%" cy="36%" r="62%">
    <stop offset="0%" stop-color="#F5EAC8"/>
    <stop offset="20%" stop-color="#E8D098"/>
    <stop offset="40%" stop-color="#D4AE6A"/>
    <stop offset="60%" stop-color="#B48840"/>
    <stop offset="78%" stop-color="#8A6020"/>
    <stop offset="100%" stop-color="#4A3010"/>
  </radialGradient>
  <radialGradient id="saturnLimb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="76%" stop-color="#0C0600" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
  </radialGradient>
  <filter id="saturnBands" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.006 0.048" numOctaves="6" seed="13" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="16" xChannelSelector="R" yChannelSelector="G" result="disp"/>
    <feColorMatrix type="matrix"
      values="1.08 0.12 0.04 0  0.04
              0.5  0.9  0.08 0  0.03
              0.08 0.12 0.6  0  0
              0    0    0    1  0"
      in="disp"/>
  </filter>
  <filter id="ringBlur" x="-5%" y="-5%" width="110%" height="110%">
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
  <filter id="saturnGlowBlur" x="-35%" y="-35%" width="170%" height="170%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <filter id="saturnAtmosBlur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <clipPath id="saturnClip"><circle cx="450" cy="450" r="200"/></clipPath>
  <!-- Ring clipping — hides rings behind planet -->
  <clipPath id="ringFrontClip">
    <rect x="0" y="470" width="900" height="430"/>
  </clipPath>
  <clipPath id="ringBackClip">
    <rect x="0" y="0" width="900" height="452"/>
  </clipPath>
  <radialGradient id="saturnHighlight" cx="30%" cy="26%" r="46%">
    <stop offset="0%" stop-color="#FFFBEE" stop-opacity="0.42"/>
    <stop offset="42%" stop-color="#F5E8C0" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#D4AA60" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="saturnShadow" cx="72%" cy="68%" r="46%">
    <stop offset="0%" stop-color="#080400" stop-opacity="0.7"/>
    <stop offset="52%" stop-color="#080400" stop-opacity="0.26"/>
    <stop offset="100%" stop-color="#080400" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="saturnAtmos" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#E8D080" stop-opacity="0"/>
    <stop offset="60%" stop-color="#D0B860" stop-opacity="0"/>
    <stop offset="72%" stop-color="#C0A040" stop-opacity="0.1"/>
    <stop offset="84%" stop-color="#D0B060" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#E0C080" stop-opacity="0"/>
  </radialGradient>
  <!-- Ring gradients -->
  <linearGradient id="ringD" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8A7448" stop-opacity="0.15"/>
    <stop offset="50%" stop-color="#A08858" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#8A7448" stop-opacity="0.15"/>
  </linearGradient>
  <linearGradient id="ringC" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#9A8458" stop-opacity="0.45"/>
    <stop offset="30%" stop-color="#B09868" stop-opacity="0.6"/>
    <stop offset="60%" stop-color="#A08858" stop-opacity="0.52"/>
    <stop offset="100%" stop-color="#9A8458" stop-opacity="0.45"/>
  </linearGradient>
  <linearGradient id="ringB" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#C8B080" stop-opacity="0.82"/>
    <stop offset="20%" stop-color="#E0C890" stop-opacity="0.92"/>
    <stop offset="40%" stop-color="#D4BC88" stop-opacity="0.88"/>
    <stop offset="60%" stop-color="#EED8A0" stop-opacity="0.95"/>
    <stop offset="80%" stop-color="#D8C088" stop-opacity="0.88"/>
    <stop offset="100%" stop-color="#C8B080" stop-opacity="0.82"/>
  </linearGradient>
  <linearGradient id="ringCassini" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
    <stop offset="50%" stop-color="#000000" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="ringA" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#B8A070" stop-opacity="0.75"/>
    <stop offset="25%" stop-color="#CCB480" stop-opacity="0.85"/>
    <stop offset="55%" stop-color="#C4AA78" stop-opacity="0.8"/>
    <stop offset="80%" stop-color="#D0B888" stop-opacity="0.82"/>
    <stop offset="100%" stop-color="#B8A070" stop-opacity="0.75"/>
  </linearGradient>
  <linearGradient id="ringEnke" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
    <stop offset="50%" stop-color="#000000" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
  </linearGradient>
  <linearGradient id="ringF" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#A89060" stop-opacity="0.4"/>
    <stop offset="50%" stop-color="#C0A870" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#A89060" stop-opacity="0.4"/>
  </linearGradient>
  <!-- Band tones for planet -->
  <linearGradient id="satBand1" x1="0%" y1="0%" x2="100%" y2="3%">
    <stop offset="0%" stop-color="#8A6828" stop-opacity="0.5"/>
    <stop offset="40%" stop-color="#9A7838" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#8A6828" stop-opacity="0.5"/>
  </linearGradient>
  <linearGradient id="satBand2" x1="0%" y1="0%" x2="100%" y2="-2%">
    <stop offset="0%" stop-color="#C8A858" stop-opacity="0.4"/>
    <stop offset="50%" stop-color="#D8B868" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#C8A858" stop-opacity="0.4"/>
  </linearGradient>
  <!-- Ring shadow on planet -->
  <linearGradient id="ringShadow" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="55%" stop-color="#000000" stop-opacity="0.28"/>
    <stop offset="68%" stop-color="#000000" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Outer glow -->
<ellipse cx="450" cy="470" rx="430" ry="160" fill="#C0A050" filter="url(#saturnGlowBlur)" opacity="0.14"/>

<!-- RINGS BACK (behind planet) -->
<g clip-path="url(#ringBackClip)">
  <!-- D ring -->
  <ellipse cx="450" cy="470" rx="222" ry="34" fill="none" stroke="url(#ringD)" stroke-width="10" filter="url(#ringBlur)"/>
  <!-- C ring -->
  <ellipse cx="450" cy="470" rx="248" ry="38" fill="none" stroke="url(#ringC)" stroke-width="22" filter="url(#ringBlur)"/>
  <!-- B ring (brightest) -->
  <ellipse cx="450" cy="470" rx="292" ry="44" fill="none" stroke="url(#ringB)" stroke-width="32" filter="url(#ringBlur)"/>
  <!-- Cassini division -->
  <ellipse cx="450" cy="470" rx="322" ry="48.5" fill="none" stroke="url(#ringCassini)" stroke-width="8" filter="url(#ringBlur)"/>
  <!-- A ring -->
  <ellipse cx="450" cy="470" rx="352" ry="53" fill="none" stroke="url(#ringA)" stroke-width="24" filter="url(#ringBlur)"/>
  <!-- Encke gap -->
  <ellipse cx="450" cy="470" rx="364" ry="54.8" fill="none" stroke="url(#ringEnke)" stroke-width="4" filter="url(#ringBlur)"/>
  <!-- F ring -->
  <ellipse cx="450" cy="470" rx="376" ry="56.5" fill="none" stroke="url(#ringF)" stroke-width="5" filter="url(#ringBlur)"/>
</g>

<!-- PLANET DISC -->
<circle cx="450" cy="450" r="200" fill="url(#saturnBase)"/>
<circle cx="450" cy="450" r="200" fill="url(#saturnBase)" filter="url(#saturnBands)" clip-path="url(#saturnClip)" opacity="0.88"/>
<!-- Cloud bands -->
<rect x="250" y="285" width="400" height="24" fill="url(#satBand1)" clip-path="url(#saturnClip)"/>
<rect x="250" y="314" width="400" height="16" fill="url(#satBand2)" clip-path="url(#saturnClip)" opacity="0.7"/>
<rect x="250" y="334" width="400" height="28" fill="url(#satBand1)" clip-path="url(#saturnClip)" opacity="0.8"/>
<rect x="250" y="366" width="400" height="14" fill="url(#satBand2)" clip-path="url(#saturnClip)" opacity="0.55"/>
<rect x="250" y="384" width="400" height="30" fill="url(#satBand1)" clip-path="url(#saturnClip)" opacity="0.75"/>
<rect x="250" y="418" width="400" height="14" fill="url(#satBand2)" clip-path="url(#saturnClip)" opacity="0.5"/>
<rect x="250" y="436" width="400" height="26" fill="url(#satBand1)" clip-path="url(#saturnClip)" opacity="0.7"/>
<rect x="250" y="466" width="400" height="20" fill="url(#satBand2)" clip-path="url(#saturnClip)" opacity="0.6"/>
<rect x="250" y="490" width="400" height="28" fill="url(#satBand1)" clip-path="url(#saturnClip)" opacity="0.72"/>
<rect x="250" y="522" width="400" height="16" fill="url(#satBand2)" clip-path="url(#saturnClip)" opacity="0.5"/>
<rect x="250" y="542" width="400" height="24" fill="url(#satBand1)" clip-path="url(#saturnClip)" opacity="0.65"/>
<rect x="250" y="570" width="400" height="18" fill="url(#satBand2)" clip-path="url(#saturnClip)" opacity="0.55"/>
<rect x="250" y="592" width="400" height="22" fill="url(#satBand1)" clip-path="url(#saturnClip)" opacity="0.6"/>
<!-- Ring shadow on planet -->
<rect x="250" y="380" width="400" height="130" fill="url(#ringShadow)" clip-path="url(#saturnClip)"/>
<circle cx="450" cy="450" r="200" fill="url(#saturnShadow)" clip-path="url(#saturnClip)"/>
<circle cx="450" cy="450" r="200" fill="url(#saturnHighlight)" clip-path="url(#saturnClip)"/>
<circle cx="450" cy="450" r="200" fill="url(#saturnLimb)"/>

<!-- RINGS FRONT (in front of planet) -->
<g clip-path="url(#ringFrontClip)">
  <ellipse cx="450" cy="470" rx="222" ry="34" fill="none" stroke="url(#ringD)" stroke-width="10" filter="url(#ringBlur)"/>
  <ellipse cx="450" cy="470" rx="248" ry="38" fill="none" stroke="url(#ringC)" stroke-width="22" filter="url(#ringBlur)"/>
  <ellipse cx="450" cy="470" rx="292" ry="44" fill="none" stroke="url(#ringB)" stroke-width="32" filter="url(#ringBlur)"/>
  <ellipse cx="450" cy="470" rx="322" ry="48.5" fill="none" stroke="url(#ringCassini)" stroke-width="8" filter="url(#ringBlur)"/>
  <ellipse cx="450" cy="470" rx="352" ry="53" fill="none" stroke="url(#ringA)" stroke-width="24" filter="url(#ringBlur)"/>
  <ellipse cx="450" cy="470" rx="364" ry="54.8" fill="none" stroke="url(#ringEnke)" stroke-width="4" filter="url(#ringBlur)"/>
  <ellipse cx="450" cy="470" rx="376" ry="56.5" fill="none" stroke="url(#ringF)" stroke-width="5" filter="url(#ringBlur)"/>
</g>

<circle cx="450" cy="450" r="206" fill="url(#saturnAtmos)" filter="url(#saturnAtmosBlur)" opacity="0.7"/>
</svg>
